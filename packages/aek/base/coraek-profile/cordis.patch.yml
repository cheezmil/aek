# @cheezmil/coraek-profile — the AEK assembly layer for a dsh web profile.
#
# This file is the package's entire substance: ONE insert over the profile
# tree, applied after dsh-base and dsh-web-app (the profile's
# `dsh.profile.bundles` list decides the order). Rows address plugins by id,
# so a later layer (the profile's own cordis.patch.yml) can still disable or
# reconfigure them.
#
# It is separate from `@cheezmil/aek-for-dsh`: that bundle carries the
# dsh-facing AEK plugins for a profile that still shows the dsh shell. This
# one is mounted only by profiles that want the AEK console as their root.

- insert:
    # ── AEK identity ─────────────────────────────────────────────────────────

    # coraek: the host-side identity layer — prints the `aek web: <url>`
    # readiness line (the dsh web-app bundle's own line is suppressed with
    # `printUrl: false` in the web profile's cordis.patch.yml).
    - id: aek-base
      name: '@cheezmil/coraek'

    # ── AEK web-search management API ───────────────────────────────────────

    # aek-websearch-admin: the host-side management API the AEK home surface
    # reads (`GET /api/aek/websearch`) and writes through
    # (`POST /api/aek/websearch`). It is the ADMIN half only — the search
    # provider itself is registered by the host that composes the search
    # seam, and coraek-profile does not own that composition.
    - id: aek-websearch-admin
      name: '@cheezmil/aek-websearch/admin'

    # ── AEK home surface ────────────────────────────────────────────────────

    # aek-home: the AEK application root. Its client half renders directly
    # into `#root` via createRoot, so the dsh slot/AppFrame system is not
    # involved; the dsh `ui-renderer` stays disabled in the web profile.
    - id: aek-home
      name: '@cheezmil/aek-home'
