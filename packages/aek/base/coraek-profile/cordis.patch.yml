# @cheezmil/coraek-profile — the AEK assembly layer for a dsh web profile.
#
# This file is the package's entire substance: ONE insert over the profile
# tree, applied after dsh-base and dsh-web-app (the profile's
# `dsh.profile.bundles` list decides the order). Rows address plugins by id,
# so a later layer (the profile's own cordis.patch.yml) can still disable or
# reconfigure them.
#
# It is separate from `@cheezmil/aek-for-dsh`: that bundle carries the
# dsh-facing AEK plugins for a profile that still shows the dsh shell. This
# one is mounted only by profiles that want the AEK console as their root.
#
# B2: the AEK console is the standalone `@cheezmil/aek-web` app (a Vite SPA
# that the web-app bundle serves unconditionally — the dsh shell was retired
# from the AEK surface, so aek-web is the only web surface). It is NOT a
# cordis client plugin, so it needs no insert row here — only the host-side
# identity + admin APIs are inserted.

# ── dev-only module hot reload ─────────────────────────────────────────────
#
# `dsh-base` mounts hmr with `root: []`: profile patches and the profile
# manifest are watched, plugin modules are not. In dev the AEK packages are
# `link:`ed into the profile, so their build outputs sit where a relative watch
# root can reach them — `node_modules/@cheezmil/<pkg>/lib` under the profile dir.
# The path stays profile-relative on purpose: the workspace lives at a different
# absolute path on every machine, and a watch root must never be hardcoded.
#
# Only the build outputs are watched, never the package roots: those links point
# at the workspace, and a root-level root would make the watcher walk every
# package's `node_modules` and tests before the host ever becomes ready.
#
# A change here is applied to the running host by module-level replacement.
# Anything the host itself links (framework packages) still falls back to a full
# host restart, which is the shell's reconnecting path (T9).
#
# Only dev turns this on: a production install would hold a watcher over its own
# node_modules for no benefit.
- id: hmr
  config:
    root: !!js "process.env.AEK_MODE === 'dev' ? ['node_modules/@cheezmil/coraek/lib', 'node_modules/@cheezmil/aek-web/dist', 'node_modules/@cheezmil/aek-websearch/lib'] : []"
    debounce: 100
    ignored: ['**/*.map']

- insert:
    # ── AEK identity ─────────────────────────────────────────────────────────

    # coraek: the host-side identity layer — prints the `aek web: <url>`
    # readiness line (the dsh web-app bundle's own line is suppressed with
    # `printUrl: false` in the web profile's cordis.patch.yml).
    - id: aek-base
      name: '@cheezmil/coraek'

    # ── AEK web-search management API ───────────────────────────────────────

    # aek-websearch-admin: the host-side management API the AEK web console
    # (aek-web) reads (`GET /api/aek/websearch`) and writes through
    # (`POST /api/aek/websearch`). It is the ADMIN half only — the search
    # provider itself is registered by the host that composes the search
    # seam, and coraek-profile does not own that composition.
    - id: aek-websearch-admin
      name: '@cheezmil/aek-websearch/admin'
