# X5 (2026-11-16, user ruling): cloud-build the Electron shell on GitHub.
#
#   - The release carries ELECTRON artifacts only (webui/host ship via npm,
#     not here).
#   - 10 artifacts total (2026-11-16 user ruling: installer AND portable
#     per platform per arch; mac has no portable, so two):
#       mac:    DMG x64 + DMG arm64
#       windows: NSIS installer x64 + NSIS installer arm64
#                (the arm64 installer's NSIS stub is x86-64, emulated on
#                Windows-on-ARM — it installs the NATIVE arm64 app, same as
#                VSCode's VCCodeUserSetup-arm64.exe)
#                + portable exe x64 + portable exe arm64
#       linux:  deb x64 + deb arm64 (installer)
#                + AppImage x64 + AppImage arm64 (portable)
#   - One file-name scheme for all ten, arch label ALWAYS in the name,
#     unified to x64/arm64 everywhere (user ruling: no x86_64, no amd64,
#     setup as .exe not .msi — like VSCode):
#       AEK-<ver>-mac-x64.dmg / -mac-arm64.dmg
#       AEK-<ver>-win-x64-setup.exe / -win-arm64-setup.exe
#       AEK-<ver>-win-x64-portable.exe / -win-arm64-portable.exe
#       AEK-<ver>-linux-x64.deb / -linux-arm64.deb
#       AEK-<ver>-linux-x64.AppImage / -linux-arm64.AppImage
#     (the builder emits AppImage x64 as x86_64 and deb x64 as amd64 —
#     each format's native label; the linux job's "Unify arch labels" step
#     renames them, and the naming plan is checked by
#     scripts/aek/verify-builder-config.mjs)
#   - Artifacts go to the GITHUB release (never Gitea). Release tags
#     follow the `aek-desktop-<sha7>` convention — the release carries
#     aek-desktop artifacts only, so the tag says what it contains
#     (2026-11-16 user ruling; the old `aek-cloud` tag was the build
#     PIPELINE name, not the product name, and is deleted).
#   - NEVER triggered by push. Manual `workflow_dispatch` only; the prompter
#     (`node scripts/aek/electron-cloud.mjs`) tells a developer WHEN a cloud
#     build is actually needed (the electron layer changed since the last one).
#
# Unsigned by design: cloud artifacts have no Developer ID / no local
# keychain. macOS end users re-sign locally (self-signed dev identity) or
# right-click → open; Windows SmartScreen applies to unsigned installers.
name: electron-cloud-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub release tag — the release carries aek-desktop artifacts only, use aek-desktop-<sha7> style, e.g. aek-desktop-0dda685'
        required: true
        default: 'aek-desktop'

permissions:
  contents: write # create the GitHub release + upload artifacts

jobs:
  # ---------------------------------------------------------------- mac ----
  build-mac:
    runs-on: macos-latest # arm64 runner; the x64 DMG is a cross-build (the
    # app is pure JS — no native modules to cross-compile)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc → lib/ (the only thing the asar ships besides package.json)
      - run: pnpm --filter aek-desktop build

      - name: Package DMG (x64 + arm64, unsigned)
        run: pnpm --filter aek-desktop exec electron-builder build --mac --config electron-builder.config.mjs
        env:
          AEK_SLOT: aek
          AEK_CI_UNSIGNED: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: electron-mac
          path: apps/aek-desktop/v0/dist/aek/
          # Keep only the newest set, for 7 days: one build uploads ~0.9 GB,
          # and the free plan's artifact-storage quota is only 500 MB/month
          # (2026 docs, shared with Packages) — 90-day default retention would
          # block the next upload mid-month. Files survive in the release.
          retention-days: 7

  # ---------------------------------------------------------- windows ----
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter aek-desktop build

      # Four Windows packages: NSIS installer (x64 + arm64) + portable exe
      # (x64 + arm64). The per-arch installer split happens because the
      # nsis artifactName pattern contains `${arch}` (builder default would
      # otherwise merge both payloads into one universal installer).
      - name: Package NSIS x64+arm64 and portable x64+arm64 (unsigned)
        run: pnpm --filter aek-desktop exec electron-builder build --win --config electron-builder.config.mjs
        env:
          AEK_SLOT: aek

      - uses: actions/upload-artifact@v4
        with:
          name: electron-win
          path: apps/aek-desktop/v0/dist/aek/
          retention-days: 7

  # ----------------------------------------------------------- linux ----
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter aek-desktop build

      # AppImage + deb, each x64 and arm64 (cross-arch is safe: pure JS app)
      - name: Package AppImage + deb (x64 + arm64)
        run: pnpm --filter aek-desktop exec electron-builder build --linux --config electron-builder.config.mjs
        env:
          AEK_SLOT: aek

      # The builder labels x64 with each format's native name (AppImage →
      # x86_64, deb → amd64; the unpacked dirs already use x64/arm64). The
      # release uses one label everywhere, x64 (user ruling 2026-11-16).
      # Renamed here so the uploaded artifact — and thus the release file —
      # already carries the final name.
      - name: Unify arch labels (x86_64/amd64 → x64)
        run: |
          cd apps/aek-desktop/v0/dist/aek
          renamed=0
          for f in *.AppImage *.deb; do
            case "$f" in
              *-x86_64.AppImage) mv -v "$f" "${f/x86_64/x64}"; renamed=1 ;;
              *-amd64.deb)       mv -v "$f" "${f/amd64/x64}";  renamed=1 ;;
            esac
          done
          if [ "$renamed" -eq 0 ]; then
            echo "expected x86_64/amd64 files to rename — builder output names changed?"
            ls -1
            exit 1
          fi
          ls -1

      - uses: actions/upload-artifact@v4
        with:
          name: electron-linux
          path: apps/aek-desktop/v0/dist/aek/
          retention-days: 7

  # --------------------------------------------------------- release ----
  publish:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten + keep only the distributable artifacts
        run: |
          # download-artifact placed each artifact at release/<artifact-name>/
          mkdir -p release/staging
          for d in electron-mac electron-win electron-linux; do
            cp -r "release/$d"/. release/staging/
          done
          # drop every unpacked app dir under any builder naming (mac-*/win-*-unpacked/
          # linux-*-unpacked, ...): only the distributable files go to the release
          find release/staging -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          # drop the CI debug dump + any differential-update blockmaps (they are
          # off in the builder config — no auto-update channel — the *.blockmap
          # wildcard stays as a guard against a future electron-builder turning
          # them back on by default)
          rm -f release/staging/builder-debug.yml release/staging/*.blockmap
          ls -lh release/staging

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          draft: false
          generate_release_notes: false
          files: |
            release/staging/**/*
